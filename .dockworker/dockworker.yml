dockworker:
  version: '6'
  application:
    name: UNB Libraries AI Gateway
    uri: https://unbscholar.dspace.lib.unb.ca
    description: >
      An AI Gateway for routing application inference requests to the appropriate endpoints within our infrastructure.
    topics:
      - dspace
      - scholar
    identifiers:
      id: unbscholar.dspace.lib.unb.ca
      slug: unbscholar-dspace-lib-unb-ca
      short_slug: scholardspace
      uuid: 3507
    framework:
      name: DSpace
      version: 9
      startup_finished_marker: 'Server startup in'
      endpoint:
        name: http
        port: 8080
        readiness_timeout: 15
    license:
      license: MIT
      holder: University of New Brunswick Libraries
    shell:
      path: /bin/sh
  endpoints:
    env:
      - prod
    deployments:
      unbscholar-dspace-lib-unb-ca:
        default: true
        managed: true
        name: unbscholar-dspace-lib-unb-ca
  workflows:
    vcs:
      type: github
      owner: unb-libraries
      name: unbscholar.dspace.lib.unb.ca
    jira:
      project_keys:
        - SCHOLAR
    image:
      name: ghcr.io/unb-libraries/unbscholar.dspace.lib.unb.ca
      parent: 
        - dspace/dspace:9.0
        - maven:3-jdk-8-alpine
        - tomcat:8-jre8
      repository: GitHub
      push-branches:
        - dev
        - prod
